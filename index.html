<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff4fa3">
    <title>Restaurant Meny</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4fa3;
            --primary-2: #ff80bf;
            --primary-3: #ffb3d9;
            --hot: #ff2e88;
            --violet: #c86bff;
            --peach: #ffb199;
            --bg-page: #fff0f6;
            --text-dark: #3a1f2d;
            --text-soft: #8a6878;
            --glass: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(255, 255, 255, 0.9);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html, body { min-height: 100%; }

        body {
            font-family: 'Manrope', 'Segoe UI', sans-serif;
            background: var(--bg-page);
            color: var(--text-dark);
            margin: 0;
            padding: 28px 16px 60px;
            overflow-x: hidden;
        }

        /* ---------- Живой фон ---------- */
        .bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            background:
                radial-gradient(120% 80% at 50% 0%, #ffe3f0 0%, transparent 60%),
                linear-gradient(160deg, #fff5f9 0%, #ffe6f1 50%, #ffd9ec 100%);
        }
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.55;
            mix-blend-mode: multiply;
            will-change: transform;
        }
        .blob.b1 { width: 420px; height: 420px; background: var(--primary-2); top: -120px; left: -100px; animation: drift1 18s ease-in-out infinite; }
        .blob.b2 { width: 360px; height: 360px; background: var(--violet); top: 30%; right: -140px; opacity: 0.35; animation: drift2 22s ease-in-out infinite; }
        .blob.b3 { width: 380px; height: 380px; background: var(--peach); bottom: -140px; left: 10%; opacity: 0.45; animation: drift3 20s ease-in-out infinite; }
        .blob.b4 { width: 260px; height: 260px; background: var(--hot); top: 55%; left: -80px; opacity: 0.3; animation: drift2 26s ease-in-out infinite reverse; }

        @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(120px, 90px) scale(1.2); } }
        @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-110px, -70px) scale(1.15); } }
        @keyframes drift3 { 0%,100% { transform: translate(0,0) scale(1.1); } 50% { transform: translate(90px, -120px) scale(0.9); } }

        canvas.fx { position: fixed; inset: 0; pointer-events: none; }
        #bg-canvas { z-index: -1; }
        #fx-canvas { z-index: 50; }

        /* ---------- Карточка ---------- */
        .card-wrap {
            position: relative;
            max-width: 560px;
            margin: 0 auto;
            border-radius: 30px;
            padding: 2px;
            animation: cardIn 1s cubic-bezier(.2,.9,.25,1.15) both;
        }
        /* Переливающаяся рамка */
        .card-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: conic-gradient(from var(--angle), var(--primary), var(--violet), var(--peach), var(--primary-3), var(--primary));
            animation: spin 6s linear infinite;
            z-index: 0;
        }
        /* Мягкое свечение за карточкой */
        .card-wrap::after {
            content: '';
            position: absolute;
            inset: 10px;
            border-radius: inherit;
            background: conic-gradient(from var(--angle), var(--primary), var(--violet), var(--peach), var(--primary));
            filter: blur(36px);
            opacity: 0.45;
            z-index: -1;
            animation: spin 6s linear infinite;
        }
        @property --angle { syntax: '<angle>'; initial-value: 0deg; inherits: false; }
        @keyframes spin { to { --angle: 360deg; } }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(40px) scale(0.94); filter: blur(8px); }
            to   { opacity: 1; transform: none; filter: none; }
        }

        .container {
            position: relative;
            z-index: 1;
            background: var(--glass);
            backdrop-filter: blur(22px) saturate(160%);
            -webkit-backdrop-filter: blur(22px) saturate(160%);
            padding: 30px 22px 18px;
            border-radius: 28px;
            overflow: hidden;
        }

        /* ---------- Заголовок ---------- */
        .hero { text-align: center; margin-bottom: 26px; }

        .ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: var(--primary);
            font-size: 14px;
            opacity: 0;
            animation: fadeUp .8s .9s ease-out forwards;
        }
        .ornament .line {
            width: 46px; height: 2px; border-radius: 2px;
            background: linear-gradient(90deg, transparent, var(--primary));
        }
        .ornament .line:last-child { background: linear-gradient(90deg, var(--primary), transparent); }
        .ornament .star { display: inline-block; animation: twinkle 2.4s ease-in-out infinite; }
        .ornament .star:nth-child(3) { animation-delay: .4s; font-size: 18px; }
        .ornament .star:nth-child(4) { animation-delay: .8s; }

        @keyframes twinkle {
            0%,100% { transform: scale(1) rotate(0); opacity: 1; }
            50% { transform: scale(1.5) rotate(90deg); opacity: .6; }
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 900;
            font-size: clamp(52px, 15vw, 76px);
            line-height: 1;
            margin: 10px 0 8px;
            letter-spacing: 1px;
        }
        h1 .ch {
            display: inline-block;
            background: linear-gradient(110deg, var(--hot) 0%, var(--violet) 30%, var(--primary-2) 50%, var(--hot) 70%, var(--violet) 100%);
            background-size: 250% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            opacity: 0;
            transform: translateY(-80px) rotate(-20deg) scale(.4);
            animation:
                dropIn .9s cubic-bezier(.3,1.6,.5,1) forwards,
                shimmer 4s linear infinite,
                bob 3s ease-in-out infinite;
            animation-delay: calc(var(--i) * 0.12s + .3s), 0s, calc(var(--i) * 0.2s + 1.4s);
            filter: drop-shadow(0 6px 14px rgba(255, 46, 136, .35));
        }
        @keyframes dropIn { to { opacity: 1; transform: none; } }
        @keyframes shimmer { to { background-position: -250% 0; } }
        @keyframes bob { 0%,100% { translate: 0 0; } 50% { translate: 0 -6px; } }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: none; }
        }

        /* ---------- Вкладки ---------- */
        .tabs-container {
            position: relative;
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin: 0 -22px 18px;
            padding: 8px 22px 14px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
            opacity: 0;
            animation: fadeUp .7s 1.1s ease-out forwards;
            -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 22px, #000 calc(100% - 22px), transparent 100%);
                    mask-image: linear-gradient(90deg, transparent 0, #000 22px, #000 calc(100% - 22px), transparent 100%);
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tab-indicator {
            position: absolute;
            top: 8px;
            left: 0;
            height: 44px;
            border-radius: 999px;
            background: linear-gradient(120deg, var(--hot), var(--primary-2), var(--violet));
            background-size: 200% 200%;
            box-shadow: 0 8px 22px rgba(255, 46, 136, .45), inset 0 1px 0 rgba(255,255,255,.5);
            transition: transform .55s cubic-bezier(.5,1.6,.4,1), width .55s cubic-bezier(.5,1.6,.4,1);
            animation: gradientFlow 4s ease infinite;
            z-index: 0;
        }
        @keyframes gradientFlow { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }

        .tab-btn {
            position: relative;
            z-index: 1;
            height: 44px;
            padding: 0 20px;
            border: 1.5px solid rgba(255, 128, 191, .35);
            background: rgba(255, 230, 240, .6);
            border-radius: 999px;
            cursor: pointer;
            white-space: nowrap;
            font-family: inherit;
            font-weight: 800;
            font-size: 15px;
            color: #8a4f6c;
            flex-shrink: 0;
            overflow: hidden;
            transition: color .35s, background .35s, border-color .35s, transform .25s cubic-bezier(.3,1.8,.5,1);
        }
        .tab-btn:hover { transform: translateY(-2px); color: var(--hot); }
        .tab-btn:active { transform: scale(.92); }
        .tab-btn.active {
            background: transparent;
            border-color: transparent;
            color: #fff;
            text-shadow: 0 1px 6px rgba(160, 0, 70, .35);
        }
        .tab-btn:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, .7);
            transform: scale(0);
            animation: ripple .7s ease-out forwards;
            pointer-events: none;
        }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }

        /* ---------- Пункты меню ---------- */
        #menu-content { position: relative; }

        .menu-page { display: none; }
        .menu-page.active { display: block; }

        .item {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 16px 16px;
            margin-bottom: 10px;
            border-radius: 20px;
            background: rgba(255, 255, 255, .75);
            border: 1px solid rgba(255, 179, 217, .45);
            box-shadow: 0 4px 14px rgba(255, 79, 163, .08);
            overflow: hidden;
            opacity: 0;
            transform-style: preserve-3d;
            transition: transform .35s cubic-bezier(.3,1.6,.5,1), box-shadow .35s, border-color .35s;
        }
        .menu-page.active .item {
            animation: itemIn .75s cubic-bezier(.2,1.3,.35,1) forwards;
            animation-delay: calc(var(--i) * 0.08s);
        }
        .menu-page.from-left.active .item { animation-name: itemInLeft; }

        @keyframes itemIn {
            from { opacity: 0; translate: 60px 0; rotate: 3deg; scale: .9; filter: blur(6px); }
            to   { opacity: 1; translate: 0 0; rotate: 0deg; scale: 1; filter: none; }
        }
        @keyframes itemInLeft {
            from { opacity: 0; translate: -60px 0; rotate: -3deg; scale: .9; filter: blur(6px); }
            to   { opacity: 1; translate: 0 0; rotate: 0deg; scale: 1; filter: none; }
        }

        /* Акцентная полоска слева */
        .item::before {
            content: '';
            position: absolute;
            left: 0; top: 18%; bottom: 18%;
            width: 4px;
            border-radius: 0 4px 4px 0;
            background: linear-gradient(var(--hot), var(--violet));
            transform: scaleY(0);
            transition: transform .4s cubic-bezier(.3,1.6,.5,1);
        }
        /* Блик, пробегающий по карточке */
        .item::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            left: -60%;
            width: 40%;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,.85), transparent);
            transform: skewX(-20deg);
            pointer-events: none;
        }

        .item.lit, .item:hover {
            box-shadow: 0 14px 34px rgba(255, 46, 136, .22);
            border-color: rgba(255, 79, 163, .6);
        }
        .item.lit::before, .item:hover::before { transform: scaleY(1); }
        .item.lit::after, .item:hover::after { animation: shine .9s ease; }
        @keyframes shine { to { left: 130%; } }

        .item-info { flex: 1; min-width: 0; }
        .item-name {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 700;
            font-size: 19px;
            margin-bottom: 4px;
            color: var(--text-dark);
            transition: color .3s;
        }
        .item:hover .item-name, .item.lit .item-name { color: var(--hot); }
        .item-desc { font-size: 13.5px; color: var(--text-soft); line-height: 1.45; }
        .item-desc:empty { display: none; }

        .item-price {
            position: relative;
            font-weight: 800;
            font-size: 15px;
            white-space: nowrap;
            color: #fff;
            padding: 8px 14px;
            border-radius: 999px;
            background: linear-gradient(120deg, var(--hot), var(--primary-2), var(--violet));
            background-size: 200% 200%;
            box-shadow: 0 6px 16px rgba(255, 46, 136, .35);
            animation: gradientFlow 5s ease infinite;
            transition: transform .35s cubic-bezier(.3,1.8,.5,1);
        }
        .item:hover .item-price, .item.lit .item-price { transform: scale(1.12) rotate(-4deg); }
        .item-price::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: inherit;
            border: 2px solid var(--primary-2);
            opacity: 0;
        }
        .item:hover .item-price::after, .item.lit .item-price::after { animation: pulseRing 1.2s ease-out infinite; }
        @keyframes pulseRing {
            from { opacity: .8; transform: scale(.9); }
            to   { opacity: 0; transform: scale(1.35); }
        }

        .swipe-hint {
            text-align: center;
            font-size: 12px;
            color: var(--text-soft);
            opacity: .7;
            margin-top: 6px;
            letter-spacing: .5px;
        }
        @media (hover: hover) { .swipe-hint { display: none; } }

        @media (max-width: 400px) {
            .container { padding: 24px 16px 14px; }
            .tabs-container { margin: 0 -16px 16px; padding: 8px 16px 14px; }
            .item { padding: 14px 13px; }
            .item-name { font-size: 17px; }
            .item-price { font-size: 14px; padding: 7px 11px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                animation-delay: 0s !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>
<body>

<div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
    <div class="blob b4"></div>
</div>
<canvas class="fx" id="bg-canvas" aria-hidden="true"></canvas>
<canvas class="fx" id="fx-canvas" aria-hidden="true"></canvas>

<div class="card-wrap">
    <div class="container">
        <div class="hero">
            <div class="ornament" aria-hidden="true">
                <span class="line"></span><span class="star">✦</span><span class="star">❤</span><span class="star">✦</span><span class="line"></span>
            </div>
            <h1 id="title">Meny</h1>
        </div>
        <div class="tabs-container" id="tabs"></div>
        <div id="menu-content"></div>
        <div class="swipe-hint" aria-hidden="true">‹ sveip ›</div>
    </div>
</div>

<script>
    const menuData = {
        "Meny": [
            { name: "Cæsarsalat", desc: "Salat, dressing, grilla kylling, tomat, egg, bacon, parmesan, brød", price: "185 kr" },
            { name: "Husets Burger", desc: "Briochebrød, heimelaga burger, husets dressing, pommes", price: "275 kr" },
            { name: "Kyllingsandwich", desc: "Ciabatta, kylling, salat, husets fetaostdressing, pommes", price: "220 kr" },
            { name: "Ciabatta med ost og skinke", desc: "Nysteikt Ciabatta, ost, skinke, salat, smør", price: "100 kr" },
            { name: "Ciabatta røykelaks og eggerøre", desc: "Nysteikt ciabatta, røkelaks, eggerøre, salat, smør", price: "120 kr" }
        ],
        "Pizza": [
            { name: "Margarita", desc: "Heimelaga italiensk bunn, rød saus, ost", price: "150 kr" },
            { name: "Silliana", desc: "Silliana salami, rød saus, ost", price: "170 kr" },
            { name: "Cæsar", desc: "Kvit saus, kylling, tomat, bacon, ost", price: "180 kr" },
            { name: "Nduja", desc: "Nduja (chillipølse), rød saus, løк, kjøttdeig, ost", price: "180 kr" },
            { name: "Pesto-pizza", desc: "Fetaost, oliven, crispi-salat, pesto, ost", price: "170 kr" },
            { name: "Hangoveren", desc: "Pepperoni, kjøttdeig, fries, kvitløksdressing, ost", price: "190 kr" }
        ],
        "Pasta": [
            { name: "Carbonara", desc: "Pasta, fløte, bacon, egg, parmesan", price: "165 kr" },
            { name: "Nduja-pasta", desc: "Nduja (chillipølse), pasta, kvitløк, løк, parmensan", price: "175 kr" },
            { name: "Kyllingpasta", desc: "Pesto, fløte, grillet kylling, parmesan", price: "170 kr" },
            { name: "Bolognese", desc: "Kjøttdeig, rød saus, løк, kvitløк, parmesan", price: "170 kr" },
            { name: "Pasta Pesto", desc: "Pesto, pasta, feta, rødløk, cherrytomat, parmesan", price: "165 kr" }
        ],
        "Dessert & Barn": [
            { name: "Chocolate kake", desc: "sjokoladekake med pepekannøtter и karamellsaus", price: "120 kr" },
            { name: "Ostekake", desc: "", price: "120 kr" },
        ],
        "Dagens": [
            { name: "Dagens rett", desc: "Dagens utvalde rett frå kjøkkenet", price: "Sjå tavle" }
        ]
    };

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let currentIndex = 0;

    function init() {
        const tabsDiv = document.getElementById('tabs');
        const contentDiv = document.getElementById('menu-content');

        // Очищаем на всякий случай
        tabsDiv.innerHTML = '';
        contentDiv.innerHTML = '';

        // Скользящая "таблетка" под активной вкладкой
        const indicator = document.createElement('div');
        indicator.className = 'tab-indicator';
        indicator.id = 'tab-indicator';
        tabsDiv.appendChild(indicator);

        Object.keys(menuData).forEach((category, index) => {
            // Создаем кнопку
            const btn = document.createElement('button');
            btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = category;
            btn.setAttribute('data-target', index); // Привязываем индекс
            btn.onclick = (e) => {
                addRipple(btn, e);
                openTab(index, btn);
            };
            tabsDiv.appendChild(btn);

            // Создаем секцию контента
            const section = document.createElement('div');
            section.id = `section-${index}`;
            section.className = `menu-page ${index === 0 ? 'active' : ''}`;

            menuData[category].forEach((item, i) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                itemDiv.style.setProperty('--i', i);
                itemDiv.innerHTML = `
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-desc">${item.desc}</div>
                    </div>
                    <div class="item-price">${item.price}</div>
                `;
                addTilt(itemDiv);
                section.appendChild(itemDiv);
            });
            contentDiv.appendChild(section);
        });

        // Заголовок по буквам
        const title = document.getElementById('title');
        title.setAttribute('aria-label', title.textContent);
        title.innerHTML = [...title.textContent]
            .map((ch, i) => `<span class="ch" aria-hidden="true" style="--i:${i}">${ch}</span>`)
            .join('');

        requestAnimationFrame(() => moveIndicator(tabsDiv.querySelector('.tab-btn.active'), true));
        window.addEventListener('resize', () => moveIndicator(tabsDiv.querySelector('.tab-btn.active'), true));
        if (document.fonts) document.fonts.ready.then(() => moveIndicator(tabsDiv.querySelector('.tab-btn.active'), true));

        addSwipe(contentDiv);
    }

    function openTab(index, btn) {
        if (index === currentIndex) {
            burst(btn, 10);
            return;
        }
        const goingLeft = index < currentIndex;
        currentIndex = index;

        // Убираем активный класс у всех кнопок и страниц
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.menu-page').forEach(p => p.classList.remove('active', 'from-left'));

        // Активируем нужные
        btn.classList.add('active');
        const page = document.getElementById(`section-${index}`);
        page.classList.toggle('from-left', goingLeft);
        page.classList.add('active');

        moveIndicator(btn);
        burst(btn, 22);
        if (navigator.vibrate) navigator.vibrate(12);

        // Плавно скроллим кнопку в центр
        btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    function moveIndicator(btn, instant) {
        const indicator = document.getElementById('tab-indicator');
        if (!btn || !indicator) return;
        if (instant) indicator.style.transition = 'none';
        indicator.style.width = btn.offsetWidth + 'px';
        indicator.style.transform = `translateX(${btn.offsetLeft}px)`;
        if (instant) {
            indicator.offsetWidth; // применяем без анимации
            indicator.style.transition = '';
        }
    }

    function addRipple(btn, e) {
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const r = document.createElement('span');
        r.className = 'ripple';
        r.style.width = r.style.height = size + 'px';
        r.style.left = ((e.clientX || rect.left + rect.width / 2) - rect.left - size / 2) + 'px';
        r.style.top = ((e.clientY || rect.top + rect.height / 2) - rect.top - size / 2) + 'px';
        btn.appendChild(r);
        setTimeout(() => r.remove(), 700);
    }

    // 3D-наклон карточки за курсором / пальцем
    function addTilt(el) {
        if (reduceMotion) return;
        el.addEventListener('pointermove', (e) => {
            if (e.pointerType !== 'mouse') return;
            const r = el.getBoundingClientRect();
            const x = (e.clientX - r.left) / r.width - 0.5;
            const y = (e.clientY - r.top) / r.height - 0.5;
            el.style.transform = `perspective(700px) rotateX(${-y * 8}deg) rotateY(${x * 8}deg) translateY(-3px) scale(1.02)`;
        });
        el.addEventListener('pointerleave', () => { el.style.transform = ''; });
        el.addEventListener('pointerdown', (e) => {
            el.classList.add('lit');
            el.style.transform = 'scale(.97)';
            sparkleAt(e.clientX, e.clientY, 8);
        });
        const release = () => {
            el.style.transform = '';
            setTimeout(() => el.classList.remove('lit'), 900);
        };
        el.addEventListener('pointerup', release);
        el.addEventListener('pointercancel', release);
    }

    // Свайп между вкладками на телефоне
    function addSwipe(area) {
        let sx = 0, sy = 0, tracking = false;
        area.addEventListener('touchstart', (e) => {
            sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
        }, { passive: true });
        area.addEventListener('touchend', (e) => {
            if (!tracking) return;
            tracking = false;
            const dx = e.changedTouches[0].clientX - sx;
            const dy = e.changedTouches[0].clientY - sy;
            if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
            const btns = document.querySelectorAll('.tab-btn');
            const next = currentIndex + (dx < 0 ? 1 : -1);
            if (next >= 0 && next < btns.length) openTab(next, btns[next]);
        }, { passive: true });
    }

    /* ---------- Частицы: сердечки, лепестки, искры ---------- */
    const COLORS = ['#ff2e88', '#ff4fa3', '#ff80bf', '#ffb3d9', '#c86bff', '#ffb199'];
    const bgCanvas = document.getElementById('bg-canvas');
    const fxCanvas = document.getElementById('fx-canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const fxCtx = fxCanvas.getContext('2d');
    let W = 0, H = 0, DPR = 1;
    const ambient = [];
    const effects = [];

    function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        [bgCanvas, fxCanvas].forEach(c => {
            c.width = W * DPR; c.height = H * DPR;
            c.style.width = W + 'px'; c.style.height = H + 'px';
        });
        bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
        fxCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }

    const rand = (a, b) => a + Math.random() * (b - a);
    const pick = arr => arr[(Math.random() * arr.length) | 0];

    function makeAmbient(initial) {
        return {
            x: rand(0, W),
            y: initial ? rand(0, H) : H + 30,
            size: rand(6, 16),
            vy: rand(0.25, 0.8),
            sway: rand(0.5, 1.6),
            phase: rand(0, Math.PI * 2),
            rot: rand(0, Math.PI * 2),
            vr: rand(-0.02, 0.02),
            color: pick(COLORS),
            alpha: rand(0.25, 0.6),
            shape: pick(['heart', 'heart', 'petal', 'dot'])
        };
    }

    function drawHeart(ctx, s) {
        ctx.beginPath();
        ctx.moveTo(0, s * 0.3);
        ctx.bezierCurveTo(-s * 0.1, s * 0.15, -s * 0.5, s * 0.05, -s * 0.5, -s * 0.2);
        ctx.bezierCurveTo(-s * 0.5, -s * 0.5, -s * 0.1, -s * 0.55, 0, -s * 0.25);
        ctx.bezierCurveTo(s * 0.1, -s * 0.55, s * 0.5, -s * 0.5, s * 0.5, -s * 0.2);
        ctx.bezierCurveTo(s * 0.5, s * 0.05, s * 0.1, s * 0.15, 0, s * 0.3);
        ctx.fill();
    }
    function drawPetal(ctx, s) {
        ctx.beginPath();
        ctx.ellipse(0, 0, s * 0.25, s * 0.5, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    function drawStar(ctx, s) {
        ctx.beginPath();
        for (let i = 0; i < 8; i++) {
            const r = i % 2 === 0 ? s * 0.5 : s * 0.14;
            const a = (i / 8) * Math.PI * 2;
            ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        }
        ctx.closePath();
        ctx.fill();
    }
    function drawShape(ctx, p) {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        if (p.shape === 'heart') drawHeart(ctx, p.size);
        else if (p.shape === 'petal') drawPetal(ctx, p.size);
        else if (p.shape === 'star') drawStar(ctx, p.size);
        else { ctx.beginPath(); ctx.arc(0, 0, p.size * 0.22, 0, Math.PI * 2); ctx.fill(); }
        ctx.restore();
    }

    // Взрыв сердечек от кнопки
    function burst(el, count) {
        if (reduceMotion) return;
        const r = el.getBoundingClientRect();
        const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
        for (let i = 0; i < count; i++) {
            const a = rand(0, Math.PI * 2);
            const sp = rand(2, 7);
            effects.push({
                x: cx, y: cy,
                vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
                g: 0.15, drag: 0.97,
                size: rand(8, 18), rot: rand(0, 6), vr: rand(-0.2, 0.2),
                color: pick(COLORS), alpha: 1, fade: rand(0.012, 0.022),
                shape: pick(['heart', 'heart', 'star'])
            });
        }
    }

    function sparkleAt(x, y, count) {
        if (reduceMotion) return;
        for (let i = 0; i < count; i++) {
            const a = rand(0, Math.PI * 2), sp = rand(0.5, 3);
            effects.push({
                x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                g: 0.03, drag: 0.95,
                size: rand(5, 11), rot: rand(0, 6), vr: rand(-0.15, 0.15),
                color: pick(COLORS), alpha: 1, fade: rand(0.025, 0.04),
                shape: pick(['star', 'heart', 'dot'])
            });
        }
    }

    // Шлейф искр за курсором
    let lastTrail = 0;
    window.addEventListener('pointermove', (e) => {
        if (reduceMotion || e.pointerType !== 'mouse') return;
        const now = performance.now();
        if (now - lastTrail < 30) return;
        lastTrail = now;
        effects.push({
            x: e.clientX, y: e.clientY,
            vx: rand(-0.6, 0.6), vy: rand(-0.4, 0.8),
            g: 0.02, drag: 0.98,
            size: rand(6, 12), rot: rand(0, 6), vr: rand(-0.1, 0.1),
            color: pick(COLORS), alpha: 0.9, fade: 0.03,
            shape: pick(['star', 'heart'])
        });
    });

    let running = true;
    function tick(t) {
        if (!running) return;
        bgCtx.clearRect(0, 0, W, H);
        for (let i = 0; i < ambient.length; i++) {
            const p = ambient[i];
            p.y -= p.vy;
            p.x += Math.sin(t / 1000 * p.sway + p.phase) * 0.4;
            p.rot += p.vr;
            if (p.y < -30) ambient[i] = makeAmbient(false);
            drawShape(bgCtx, p);
        }

        fxCtx.clearRect(0, 0, W, H);
        for (let i = effects.length - 1; i >= 0; i--) {
            const p = effects[i];
            p.vx *= p.drag; p.vy = p.vy * p.drag + p.g;
            p.x += p.vx; p.y += p.vy;
            p.rot += p.vr;
            p.alpha -= p.fade;
            if (p.alpha <= 0) { effects.splice(i, 1); continue; }
            drawShape(fxCtx, p);
        }
        requestAnimationFrame(tick);
    }

    function startParticles() {
        resize();
        window.addEventListener('resize', resize);
        if (reduceMotion) return;
        const count = Math.round(Math.min(45, (W * H) / 22000));
        for (let i = 0; i < count; i++) ambient.push(makeAmbient(true));
        document.addEventListener('visibilitychange', () => {
            running = !document.hidden;
            if (running) requestAnimationFrame(tick);
        });
        requestAnimationFrame(tick);
        // Приветственный салют после появления заголовка
        setTimeout(() => burst(document.getElementById('title'), 36), 900);
    }

    init();
    startParticles();
</script>

</body>
</html>
