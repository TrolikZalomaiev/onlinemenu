<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F9F7F7">
    <title>Meny – Elvehagen Hotell</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* Farger frå logoen og nettsida til Elvehagen */
        :root {
            --pink: #e8239a;
            --pink-soft: #f774c0;
            --pink-pale: #fde8f3;
            --navy: #33425b;
            --navy-dark: #232f42;
            --sky: #a3d3ea;
            --sky-pale: #e9f5fb;
            --bg: #f9f7f7;
            --line: #ece6e8;
            --text: #3a3636;
            --text-soft: #6c6d7a;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Lato', sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 28px 16px 56px;
            overflow-x: hidden;
        }

        /* ---------- Bakgrunn ---------- */
        .bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            background: var(--bg);
        }
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            will-change: transform;
        }
        .glow.g1 { width: 420px; height: 420px; background: var(--pink-pale); top: -140px; left: -120px; animation: drift1 22s ease-in-out infinite; }
        .glow.g2 { width: 380px; height: 380px; background: var(--sky-pale); bottom: -140px; right: -120px; animation: drift2 26s ease-in-out infinite; }

        @keyframes drift1 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(90px, 70px) scale(1.15); } }
        @keyframes drift2 { 0%,100% { transform: translate(0,0) scale(1); } 50% { transform: translate(-90px, -60px) scale(1.1); } }

        #petals { position: fixed; inset: 0; z-index: -1; pointer-events: none; }

        /* ---------- Kort ---------- */
        .container {
            position: relative;
            max-width: 600px;
            margin: 0 auto;
            background: rgba(255, 255, 255, .88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 34px 26px 22px;
            border-radius: 6px;
            border: 1px solid var(--line);
            box-shadow: 0 20px 50px rgba(51, 66, 91, .08);
            animation: cardIn .9s cubic-bezier(.2,.8,.25,1) both;
        }
        /* Tynn rosa-blå linje øvst, som vatnet i logoen */
        .container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            border-radius: 6px 6px 0 0;
            background: linear-gradient(90deg, var(--pink-soft), var(--pink), var(--sky), var(--pink-soft));
            background-size: 300% 100%;
            animation: flow 8s linear infinite;
        }
        @keyframes flow { to { background-position: 300% 0; } }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: none; }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: none; }
        }

        /* ---------- Topp ---------- */
        .hero { text-align: center; margin-bottom: 26px; }

        .logo {
            display: block;
            width: 230px;
            max-width: 70%;
            height: auto;
            margin: 0 auto;
            opacity: 0;
            animation: logoIn 1.1s .2s cubic-bezier(.2,.8,.25,1) forwards;
        }
        @keyframes logoIn {
            from { opacity: 0; transform: translateY(-14px) scale(.96); filter: blur(4px); }
            to   { opacity: 1; transform: none; filter: none; }
        }

        h1 {
            font-family: 'Lora', Georgia, serif;
            font-weight: 600;
            font-size: clamp(36px, 10vw, 48px);
            color: var(--navy);
            line-height: 1.1;
            margin: 22px 0 0;
            opacity: 0;
            animation: fadeUp .8s .6s ease-out forwards;
        }

        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 10px;
            opacity: 0;
            animation: fadeUp .8s .8s ease-out forwards;
        }
        .divider .line {
            height: 1px;
            width: 0;
            background: var(--navy);
            opacity: .45;
            animation: grow 1s 1s ease-out forwards;
        }
        @keyframes grow { to { width: 54px; } }
        .divider .dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--pink);
            box-shadow: 0 0 0 4px var(--pink-pale);
            animation: pulse 2.6s ease-in-out infinite;
        }
        @keyframes pulse { 50% { transform: scale(1.35); box-shadow: 0 0 0 7px var(--pink-pale); } }

        /* ---------- Faner ---------- */
        .tabs-container {
            position: relative;
            display: flex;
            overflow-x: auto;
            gap: 6px;
            margin: 0 -26px 20px;
            padding: 4px 26px 4px;
            border-bottom: 1px solid var(--line);
            scrollbar-width: none;
            -ms-overflow-style: none;
            -webkit-overflow-scrolling: touch;
            opacity: 0;
            animation: fadeUp .7s 1s ease-out forwards;
        }
        .tabs-container::-webkit-scrollbar { display: none; }

        .tab-indicator {
            position: absolute;
            bottom: -1px;
            left: 0;
            height: 3px;
            border-radius: 3px 3px 0 0;
            background: var(--pink);
            transition: transform .5s cubic-bezier(.6,1.4,.4,1), width .5s cubic-bezier(.6,1.4,.4,1);
            z-index: 2;
        }

        .tab-btn {
            position: relative;
            z-index: 1;
            padding: 12px 16px 14px;
            border: none;
            background: none;
            cursor: pointer;
            white-space: nowrap;
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 1.4px;
            text-transform: uppercase;
            color: var(--text-soft);
            flex-shrink: 0;
            overflow: hidden;
            border-radius: 6px 6px 0 0;
            transition: color .3s, background .3s;
        }
        .tab-btn:hover { color: var(--navy); background: var(--sky-pale); }
        .tab-btn.active { color: var(--pink); }
        .tab-btn:focus-visible { outline: 2px solid var(--sky); outline-offset: -2px; }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(232, 35, 154, .15);
            transform: scale(0);
            animation: ripple .6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }

        /* ---------- Rettar ---------- */
        .menu-page { display: none; }
        .menu-page.active { display: block; }

        .item {
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            padding: 18px 14px 18px 18px;
            border-bottom: 1px solid var(--line);
            overflow: hidden;
            opacity: 0;
            transition: background .35s;
        }
        .item:last-of-type { border-bottom: none; }
        .menu-page.active .item {
            animation: itemIn .65s cubic-bezier(.2,.8,.25,1) forwards;
            animation-delay: calc(var(--i) * 0.07s);
        }
        .menu-page.from-left.active .item { animation-name: itemInLeft; }

        @keyframes itemIn {
            from { opacity: 0; translate: 36px 0; }
            to   { opacity: 1; translate: 0 0; }
        }
        @keyframes itemInLeft {
            from { opacity: 0; translate: -36px 0; }
            to   { opacity: 1; translate: 0 0; }
        }

        /* Rosa strek til venstre ved hover */
        .item::before {
            content: '';
            position: absolute;
            left: 0; top: 18px; bottom: 18px;
            width: 3px;
            border-radius: 3px;
            background: linear-gradient(var(--pink), var(--sky));
            transform: scaleY(0);
            transition: transform .4s cubic-bezier(.3,1.4,.5,1);
        }
        /* Lysglimt over raden */
        .item::after {
            content: '';
            position: absolute;
            top: 0; bottom: 0;
            left: -60%;
            width: 40%;
            background: linear-gradient(100deg, transparent, rgba(255,255,255,.9), transparent);
            transform: skewX(-20deg);
            pointer-events: none;
        }
        .item:hover, .item.lit { background: linear-gradient(90deg, var(--pink-pale), rgba(253, 232, 243, 0)); }
        .item:hover::before, .item.lit::before { transform: scaleY(1); }
        .item:hover::after, .item.lit::after { animation: shine .9s ease; }
        @keyframes shine { to { left: 130%; } }

        .item-info { flex: 1; min-width: 0; }
        .item-name {
            font-family: 'Lora', Georgia, serif;
            font-weight: 600;
            font-size: 19px;
            color: var(--navy);
            margin-bottom: 4px;
            transition: color .3s;
        }
        .item:hover .item-name, .item.lit .item-name { color: var(--pink); }
        .item-desc { font-size: 14.5px; color: var(--text-soft); line-height: 1.55; }
        .item-desc:empty { display: none; }
        .item-allergy {
            display: inline-block;
            margin-top: 8px;
            font-size: 12px;
            font-weight: 700;
            color: var(--navy);
            background: var(--sky-pale);
            padding: 3px 10px;
            border-radius: 999px;
        }

        .item-price {
            font-family: 'Lora', Georgia, serif;
            font-weight: 700;
            font-size: 18px;
            white-space: nowrap;
            color: var(--pink);
            padding-top: 1px;
            transition: transform .35s cubic-bezier(.3,1.8,.5,1);
        }
        .item:hover .item-price, .item.lit .item-price { transform: scale(1.1); }

        .menu-notes {
            margin-top: 14px;
            padding: 16px 18px;
            border-radius: 6px;
            background: var(--sky-pale);
            border-left: 3px solid var(--sky);
            opacity: 0;
        }
        .menu-page.active .menu-notes {
            animation: fadeUp .6s ease-out forwards;
            animation-delay: calc(var(--i) * 0.07s);
        }
        .menu-notes .note {
            position: relative;
            padding-left: 18px;
            font-size: 14px;
            color: var(--navy);
            line-height: 1.5;
        }
        .menu-notes .note + .note { margin-top: 6px; }
        .menu-notes .note::before {
            content: '';
            position: absolute;
            left: 2px; top: 8px;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--pink);
        }

        @media (max-width: 400px) {
            .container { padding: 28px 18px 16px; }
            .tabs-container { margin: 0 -18px 16px; padding: 4px 18px 4px; }
            .tab-btn { padding: 12px 12px 14px; font-size: 13px; letter-spacing: 1px; }
            .item { padding: 16px 8px 16px 14px; }
            .item-name { font-size: 17px; }
            .item-price { font-size: 16px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                animation-delay: 0s !important;
                transition-duration: .001ms !important;
            }
        }
    </style>
</head>

            { name: "Bolognese", desc: "Kjøttdeig, rød saus, løk, kvitløk, parmesan", allergy: "Gluten (hvete), melk, sulfitt", price: "170 kr" },
            { name: "Pasta Pesto", desc: "Pesto, pasta, feta, rødløk, cherrytomat, parmesan", allergy: "Gluten (hvete), melk, nøtt (pinjekjerner)", price: "165 kr" }
        ],
        "Barnemeny": [
            { name: "Minipizza ost og skinke", desc: "Heimelaga italiensk bunn, ost, skinke", allergy: "Gluten (hvete), melk", price: "99 kr" },
            { name: "Burger med fries", desc: "", allergy: "Melk, egg, gluten (hvete)", price: "99 kr" },
            { name: "Pølse med brød/fries", desc: "", allergy: "Gluten (hvete)", price: "99 kr" }
        ]
    };

    // Merknader under kategorien
    const menuNotes = {
        "Pizza": [
            "All pizza kan lagast stor, anbefalt til 2–3 pers, for 250–285 kr",
            "Kvitløkdressing 45 kr",
            "All pizza kan bestillast som takeaway",
            "All pizza kan serverast glutenfri +20 kr (kun 30 cm)"
        ],
        "Pasta": [
            "All pasta kan serverast med brød",
            "All pasta kan serverast glutenfritt +20 kr"
        ]
    };

    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let currentIndex = 0;

    function init() {
        const tabsDiv = document.getElementById('tabs');
        const contentDiv = document.getElementById('menu-content');

        tabsDiv.innerHTML = '';
        contentDiv.innerHTML = '';

        // Rosa strek under aktiv fane
        const indicator = document.createElement('div');
        indicator.className = 'tab-indicator';
        indicator.id = 'tab-indicator';
        tabsDiv.appendChild(indicator);

        Object.keys(menuData).forEach((category, index) => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${index === 0 ? 'active' : ''}`;
            btn.innerText = category;
            btn.onclick = (e) => {
                addRipple(btn, e);
                openTab(index, btn);
            };
            tabsDiv.appendChild(btn);

            const section = document.createElement('div');
            section.id = `section-${index}`;
            section.className = `menu-page ${index === 0 ? 'active' : ''}`;

            menuData[category].forEach((item, i) => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item';
                itemDiv.style.setProperty('--i', i);
                itemDiv.innerHTML = `
                    <div class="item-info">
                        <div class="item-name">${item.name}</div>
                        <div class="item-desc">${item.desc}</div>
                        ${item.allergy ? `<div class="item-allergy">Allergen: ${item.allergy}</div>` : ''}
                    </div>
                    <div class="item-price">${item.price}</div>
                `;
                addTouchGlow(itemDiv);
                section.appendChild(itemDiv);
            });

            if (menuNotes[category]) {
                const notes = document.createElement('div');
                notes.className = 'menu-notes';
                notes.style.setProperty('--i', menuData[category].length);
                notes.innerHTML = menuNotes[category].map(n => `<div class="note">${n}</div>`).join('');
                section.appendChild(notes);
            }
            contentDiv.appendChild(section);
        });

        const placeIndicator = () => moveIndicator(tabsDiv.querySelector('.tab-btn.active'), true);
        requestAnimationFrame(placeIndicator);
        window.addEventListener('resize', placeIndicator);
        if (document.fonts) document.fonts.ready.then(placeIndicator);

        addSwipe(contentDiv);
    }

    function openTab(index, btn) {
        if (index === currentIndex) return;
        const goingLeft = index < currentIndex;
        currentIndex = index;

        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.menu-page').forEach(p => p.classList.remove('active', 'from-left'));

        btn.classList.add('active');
        const page = document.getElementById(`section-${index}`);
        page.classList.toggle('from-left', goingLeft);
        page.classList.add('active');

        moveIndicator(btn);
        btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
    }

    function moveIndicator(btn, instant) {
        const indicator = document.getElementById('tab-indicator');
        if (!btn || !indicator) return;
        if (instant) indicator.style.transition = 'none';
        indicator.style.width = btn.offsetWidth + 'px';
        indicator.style.transform = `translateX(${btn.offsetLeft}px)`;
        if (instant) {
            indicator.offsetWidth;
            indicator.style.transition = '';
        }
    }

    function addRipple(btn, e) {
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const r = document.createElement('span');
        r.className = 'ripple';
        r.style.width = r.style.height = size + 'px';
        r.style.left = ((e.clientX || rect.left + rect.width / 2) - rect.left - size / 2) + 'px';
        r.style.top = ((e.clientY || rect.top + rect.height / 2) - rect.top - size / 2) + 'px';
        btn.appendChild(r);
        setTimeout(() => r.remove(), 600);
    }

    // På mobil: same effekt som hover når ein trykkjer på ein rett
    function addTouchGlow(el) {
        el.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'mouse') return;
            el.classList.add('lit');
            setTimeout(() => el.classList.remove('lit'), 1000);
        });
    }

    // Sveip mellom fanene på mobil
    function addSwipe(area) {
        let sx = 0, sy = 0, tracking = false;
        area.addEventListener('touchstart', (e) => {
            sx = e.touches[0].clientX; sy = e.touches[0].clientY; tracking = true;
        }, { passive: true });
        area.addEventListener('touchend', (e) => {
            if (!tracking) return;
            tracking = false;
            const dx = e.changedTouches[0].clientX - sx;
            const dy = e.changedTouches[0].clientY - sy;
            if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
            const btns = document.querySelectorAll('.tab-btn');
            const next = currentIndex + (dx < 0 ? 1 : -1);
            if (next >= 0 && next < btns.length) openTab(next, btns[next]);
        }, { passive: true });
    }

    /* ---------- Blomeblad som dalar ned, som frå treet i logoen ---------- */
    const COLORS = ['#e8239a', '#f774c0', '#f9a8d4', '#a3d3ea'];
    const canvas = document.getElementById('petals');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0;
    const petals = [];

    function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        canvas.width = W * dpr; canvas.height = H * dpr;
        canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    const rand = (a, b) => a + Math.random() * (b - a);

    function makePetal(initial) {
        return {
            x: rand(0, W),
            y: initial ? rand(-H, H) : rand(-60, -20),
            size: rand(6, 12),
            vy: rand(0.35, 0.9),
            sway: rand(0.4, 1.2),
            phase: rand(0, Math.PI * 2),
            rot: rand(0, Math.PI * 2),
            vr: rand(-0.02, 0.02),
            flip: rand(0, Math.PI * 2),
            color: COLORS[(Math.random() * COLORS.length) | 0],
            alpha: rand(0.25, 0.55)
        };
    }

    function tick(t) {
        if (document.hidden) return;
        ctx.clearRect(0, 0, W, H);
        for (let i = 0; i < petals.length; i++) {
            const p = petals[i];
            p.y += p.vy;
            p.x += Math.sin(t / 1000 * p.sway + p.phase) * 0.6;
            p.rot += p.vr;
            p.flip += 0.03;
            if (p.y > H + 30) petals[i] = makePetal(false);
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.scale(1, Math.abs(Math.cos(p.flip)) * 0.7 + 0.3);
            ctx.globalAlpha = p.alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, p.size * 0.32, p.size * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
        requestAnimationFrame(tick);
    }

    function startPetals() {
        resize();
        window.addEventListener('resize', resize);
        if (reduceMotion) return;
        const count = Math.round(Math.min(26, (W * H) / 40000));
        for (let i = 0; i < count; i++) petals.push(makePetal(true));
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) requestAnimationFrame(tick);
        });
        requestAnimationFrame(tick);
    }

    init();
    startPetals();
</script>

</body>
</html>
